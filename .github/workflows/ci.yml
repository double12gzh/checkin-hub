name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification harness (Lint, Format, Unit Tests, Contracts)
        run: npm run check

      - name: Test plugin discovery
        run: node index.js --list
